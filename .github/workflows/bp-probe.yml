name: bp-probe
on: [push, workflow_dispatch]
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLIENT: 793a875e-6370-4bbb-a870-70fd9de1d0be
      TENANT: a1703377-5293-489d-9667-2e87c07c211a
    steps:
      - name: mint-exchange-decode
        run: |
          set -euo pipefail
          JWT=$(curl -s -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq -r .value)
          echo "sub=$(python3 -c "import base64,json,sys;p=sys.argv[1].split('.')[1];p+='='*(-len(p)%4);print(json.loads(base64.urlsafe_b64decode(p))['sub'])" "$JWT")"
          OUT=$(curl -s -X POST "https://login.microsoftonline.com/${TENANT}/oauth2/v2.0/token" \
            --data-urlencode grant_type=client_credentials \
            --data-urlencode "client_id=${CLIENT}" \
            --data-urlencode scope=https://graph.microsoft.com/.default \
            --data-urlencode client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer \
            --data-urlencode "client_assertion=${JWT}")
          echo "codes=$(jq -c '.error_codes // []' <<<"$OUT") error=$(jq -r '.error // "OK"' <<<"$OUT")"
          AT=$(jq -r '.access_token // empty' <<<"$OUT")
          if [ -n "$AT" ]; then
            python3 -c "import base64,json,sys;p=sys.argv[1].split('.')[1];p+='='*(-len(p)%4);d=json.loads(base64.urlsafe_b64decode(p));print('ISSUED_CLAIMS='+json.dumps({k:d[k] for k in ['tid','idtyp','aud','appid','appidacr','roles','sub','ver'] if k in d}))" "$AT"
          fi
